<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競馬結果パーサー</title>
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-muted: #64748b;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --gray: #6b7280;
    --gray-bg: #f9fafb;
    --orange: #ea580c;
    --orange-bg: #fff7ed;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --blue: #2563eb;
    --blue-bg: #eff6ff;
    --yellow: #ca8a04;
    --yellow-bg: #fefce8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 20px;
  }
  .container { max-width: 960px; margin: 0 auto; }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text);
  }
  .header p {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-top: 4px;
  }

  /* Tab bar */
  .tab-bar {
    display: flex;
    gap: 2px;
    margin-bottom: 20px;
    border-bottom: 2px solid var(--border);
    overflow-x: auto;
  }
  .tab-btn {
    position: relative;
    padding: 10px 18px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: color 0.2s, border-color 0.2s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    margin-left: 6px;
    vertical-align: middle;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .tab-btn.has-data .dot { opacity: 1; }
  .tab-btn.summary-tab { margin-left: 8px; padding-left: 20px; border-left: 1px solid var(--border); }

  .race-panel { display: none; }
  .race-panel.active { display: block; }

  /* Input Section */
  .input-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 32px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .upload-area:hover, .upload-area.dragover {
    border-color: var(--accent);
    background: var(--blue-bg);
  }
  .upload-area p { color: var(--text-muted); margin-bottom: 8px; }
  .upload-area .icon { font-size: 2rem; margin-bottom: 8px; }
  .upload-area .link { color: var(--accent); font-weight: 600; }

  .divider {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
    margin: 16px 0;
    position: relative;
  }
  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 40%;
    height: 1px;
    background: var(--border);
  }
  .divider::before { left: 0; }
  .divider::after { right: 0; }

  .pasteArea {
    width: 100%;
    min-height: 120px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 0.85rem;
    font-family: 'Menlo', 'Monaco', monospace;
    resize: vertical;
    color: var(--text);
  }
  .pasteArea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  .btn-group { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-secondary:hover:not(:disabled) { background: #cbd5e1; }
  .btn-success { background: var(--green); color: white; }
  .btn-success:hover:not(:disabled) { background: #15803d; }

  /* Race Info */
  .race-info {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .race-info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px 16px;
  }
  .race-info-item { font-size: 0.85rem; }
  .race-info-item .label { color: var(--text-muted); }
  .race-info-item .value { font-weight: 600; }

  /* Results Table */
  .results-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .table-wrapper { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  thead th {
    background: #f1f5f9;
    padding: 12px 16px;
    text-align: left;
    font-weight: 600;
    color: var(--text);
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    position: sticky;
    top: 0;
  }
  tbody td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #f8fafc; }

  /* Row backgrounds for exceptions */
  tr.row-cancel { background: var(--gray-bg); }
  tr.row-exclude { background: var(--orange-bg); }
  tr.row-dnf { background: var(--red-bg); }
  tr.row-disqualify { background: var(--red-bg); }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 600;
    margin-left: 6px;
    vertical-align: middle;
  }
  .badge-cancel { background: #e5e7eb; color: var(--gray); }
  .badge-exclude { background: #fed7aa; color: var(--orange); }
  .badge-dnf { background: #fecaca; color: var(--red); }
  .badge-disqualify { background: #fecaca; color: var(--red); }
  .badge-deadheat { background: var(--blue-bg); color: var(--blue); }
  .badge-race { background: var(--blue-bg); color: var(--blue); font-weight: 700; }

  /* Warnings */
  .warnings-card {
    background: var(--yellow-bg);
    border: 1px solid #fde68a;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .warnings-card h3 {
    font-size: 0.95rem;
    color: var(--yellow);
    margin-bottom: 8px;
  }
  .warnings-card ul { list-style: none; }
  .warnings-card li {
    font-size: 0.85rem;
    color: #92400e;
    padding: 4px 0;
    padding-left: 20px;
    position: relative;
  }
  .warnings-card li::before {
    content: '⚠';
    position: absolute;
    left: 0;
  }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }

  .hidden { display: none !important; }

  /* Responsive */
  @media (max-width: 640px) {
    body { padding: 12px; }
    .header h1 { font-size: 1.3rem; }
    .race-info-grid { grid-template-columns: 1fr 1fr; }
    .btn-group { flex-direction: column; }
    .btn { width: 100%; }
    .tab-btn { padding: 8px 12px; font-size: 0.85rem; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>競馬結果パーサー</h1>
    <p>NAR・吉馬形式の結果テキストから着順・馬番・馬名・コーナー通過順・人気を抽出</p>
  </div>

  <div class="tab-bar" id="tabBar"></div>

  <div id="panelsContainer"></div>
</div>

<script>
// ============================================
// グローバル状態
// ============================================
const RACE_NUMBERS = [1, 2, 3, 4, 5, 6];
let raceData = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null };
let currentTab = 1; // 1-6 or 'summary'

// ============================================
// 初期化：タブバー & パネル生成
// ============================================
function init() {
  const tabBar = document.getElementById('tabBar');
  const panelsContainer = document.getElementById('panelsContainer');

  RACE_NUMBERS.forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.id = `tabBtn_${n}`;
    btn.innerHTML = `R${n}<span class="dot"></span>`;
    btn.onclick = () => showTab(n);
    tabBar.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'race-panel';
    panel.id = `racePanel_${n}`;
    panel.innerHTML = raceRacePanelHTML();
    panelsContainer.appendChild(panel);
    attachRaceHandlers(panel, n);
  });

  const summaryBtn = document.createElement('button');
  summaryBtn.className = 'tab-btn summary-tab';
  summaryBtn.id = 'tabBtn_summary';
  summaryBtn.textContent = '一覧';
  summaryBtn.onclick = () => showTab('summary');
  tabBar.appendChild(summaryBtn);

  const summaryPanel = document.createElement('div');
  summaryPanel.className = 'race-panel';
  summaryPanel.id = 'racePanel_summary';
  summaryPanel.innerHTML = summaryPanelHTML();
  panelsContainer.appendChild(summaryPanel);
  document.getElementById('summaryExportBtn').onclick = exportSummaryCSV;

  showTab(1);
}

function raceRacePanelHTML() {
  return `
    <div class="input-card">
      <textarea class="pasteArea" placeholder="ここに結果テキストを貼り付け..."></textarea>
      <div class="btn-group">
        <button class="btn btn-primary parseBtn">解析する</button>
        <button class="btn btn-secondary clearBtn">クリア</button>
      </div>
    </div>

    <div class="warnings-card hidden warningsCard">
      <h3>解析警告</h3>
      <ul class="warningsList"></ul>
    </div>

    <div class="race-info hidden raceInfoCard">
      <div class="race-info-grid"></div>
    </div>

    <div>
      <div class="empty-state emptyState">
        <div class="icon">🏇</div>
        <p>ファイルをアップロードまたはテキストを貼り付けて解析してください</p>
      </div>
      <div class="results-card hidden resultsCard">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>着順</th>
                <th>馬番</th>
                <th>馬名</th>
                <th>コーナー通過順</th>
                <th>人気</th>
              </tr>
            </thead>
            <tbody class="resultsBody"></tbody>
          </table>
        </div>
      </div>
      <div class="btn-group hidden exportButtons">
        <button class="btn btn-success exportCsvBtn">CSV出力</button>
        <button class="btn btn-secondary copyBtn">クリップボードにコピー</button>
      </div>
    </div>
  `;
}

function summaryPanelHTML() {
  return `
    <div class="empty-state" id="summaryEmptyState">
      <div class="icon">📋</div>
      <p>各Rのタブでテキストを解析すると、ここに一覧表示されます</p>
    </div>
    <div class="results-card hidden" id="summaryResultsCard">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>R</th>
              <th>着順</th>
              <th>馬番</th>
              <th>馬名</th>
              <th>コーナー通過順</th>
              <th>人気</th>
              <th>馬場状態</th>
            </tr>
          </thead>
          <tbody id="summaryBody"></tbody>
        </table>
      </div>
    </div>
    <div class="btn-group hidden" id="summaryExportButtons">
      <button class="btn btn-success" id="summaryExportBtn">CSV出力</button>
    </div>
  `;
}

// ============================================
// タブ切り替え
// ============================================
function showTab(tab) {
  currentTab = tab;
  RACE_NUMBERS.forEach(n => {
    document.getElementById(`racePanel_${n}`).classList.toggle('active', tab === n);
    document.getElementById(`tabBtn_${n}`).classList.toggle('active', tab === n);
  });
  document.getElementById('racePanel_summary').classList.toggle('active', tab === 'summary');
  document.getElementById('tabBtn_summary').classList.toggle('active', tab === 'summary');

  if (tab === 'summary') renderSummary();
}

function updateTabIndicator(n) {
  const btn = document.getElementById(`tabBtn_${n}`);
  const hasData = !!(raceData[n] && raceData[n].results.length > 0);
  btn.classList.toggle('has-data', hasData);
}

// ============================================
// 各レースタブのイベント設定
// ============================================
function attachRaceHandlers(panel, n) {
  const pasteArea = panel.querySelector('.pasteArea');
  const parseBtn = panel.querySelector('.parseBtn');
  const clearBtn = panel.querySelector('.clearBtn');
  const exportCsvBtn = panel.querySelector('.exportCsvBtn');
  const copyBtn = panel.querySelector('.copyBtn');

  parseBtn.addEventListener('click', () => parseInputForRace(n, panel, pasteArea));
  clearBtn.addEventListener('click', () => clearRace(n, panel, pasteArea));
  exportCsvBtn.addEventListener('click', () => exportCSVRace(n));
  copyBtn.addEventListener('click', (e) => copyToClipboardRace(n, e));
}

function parseInputForRace(n, panel, pasteArea) {
  const text = pasteArea.value.trim();
  if (!text) {
    alert('テキストを入力またはファイルをアップロードしてください。');
    return;
  }
  const result = parseRaceText(text);
  raceData[n] = result;
  renderResultsForRace(panel, result);
  updateTabIndicator(n);
}

function clearRace(n, panel, pasteArea) {
  pasteArea.value = '';
  raceData[n] = null;
  panel.querySelector('.warningsCard').classList.add('hidden');
  panel.querySelector('.raceInfoCard').classList.add('hidden');
  panel.querySelector('.resultsCard').classList.add('hidden');
  panel.querySelector('.exportButtons').classList.add('hidden');
  panel.querySelector('.emptyState').classList.remove('hidden');
  updateTabIndicator(n);
}

// ============================================
// パーサー本体（元のロジックを維持）
// ============================================
function parseRaceText(text) {
  const lines = text.split(/\r?\n/);
  const results = [];
  const warnings = [];
  const raceInfo = {};

  // --- レース情報の抽出 ---
  for (const line of lines) {
    const m = line.match(/(\d{4}年\s*\d{1,2}月\s*\d{1,2}日\s*[（(][^)）]+[)）])\s*(.+?)\s*第\s*(\d+)\s*競走/);
    if (m) {
      raceInfo.date = m[1].replace(/\s+/g, ' ');
      raceInfo.venue = m[2].replace(/[　\s競馬]/g, '');
      raceInfo.raceNumber = m[3];
      break;
    }
  }

  for (const line of lines) {
    const m = line.match(/(ダート|芝)\s*[　\s]*(\d+)\s*[ｍm]/i);
    if (m) {
      raceInfo.trackType = m[1];
      raceInfo.distance = m[2] + 'm';
      break;
    }
  }
  for (const line of lines) {
    const wm = line.match(/天候[：:]\s*(\S+)/);
    if (wm) raceInfo.weather = wm[1];
    const cm = line.match(/馬場(?:状態)?[：:]\s*(\S+)/);
    if (cm) raceInfo.trackCondition = cm[1];
    if (raceInfo.weather && raceInfo.trackCondition) break;
  }

  let dateLineIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].match(/\d{4}年.*競走成績/) || lines[i].match(/\d{4}年.*第\d+競走/)) {
      dateLineIdx = i;
      break;
    }
  }
  if (dateLineIdx >= 0) {
    const nameCandidates = [];
    for (let i = dateLineIdx + 1; i < lines.length; i++) {
      const trimmed = lines[i].trim();
      if (!trimmed) continue;
      if (trimmed.match(/ダート|芝|サラブレッド|サラ系|電話投票|発走/)) break;
      if (trimmed.match(/^\(\d着\)|^賞金|^本賞金/)) continue;
      if (trimmed.length >= 2 && !trimmed.match(/^(出馬表|オッズ|対戦表|印刷|レース映像|■)/)) {
        nameCandidates.push(trimmed);
        if (nameCandidates.length >= 2) break;
      }
    }
    if (nameCandidates.length >= 1) raceInfo.raceName = nameCandidates.join(' ');
  }

  let format = null;
  let startIdx = -1;
  let cornerIdx = -1;
  let popularityIdx = -1;

  for (let i = 0; i < lines.length; i++) {
    if (lines[i].includes('角通過順')) {
      format = 'yoshi';
      startIdx = i;
      const headers = lines[i].split('\t').map(h => h.trim());
      headers.forEach((h, idx) => {
        if (h.includes('角通過') || h.includes('コーナー')) cornerIdx = idx;
        if (h === '人' || h.includes('人気')) popularityIdx = idx;
      });
      break;
    }
  }
  if (format !== 'yoshi') {
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].includes('着順') && lines[i].includes('馬名')) {
        format = 'nar';
        startIdx = i;
        break;
      }
    }
  }
  if (startIdx === -1) {
    warnings.push('ヘッダー行が見つかりませんでした。データ行を直接検索します。');
    startIdx = 0;
    format = 'auto';
  }

  let endIdx = lines.length;
  for (let i = startIdx + 1; i < lines.length; i++) {
    const trimmed = lines[i].trim();
    if (trimmed.startsWith('払戻金') || trimmed.startsWith('[PR]') || trimmed.startsWith('■') || trimmed.startsWith('配当')) {
      endIdx = i;
      break;
    }
  }

  const skipKeywords = ['着順', '重量', '騎手', '調教師', '増減', 'タイム', '着差',
    '上がり', '3F', 'コーナー', '通過順', '人気', '単勝', 'オッズ', '枠', '所属', '性齢', '馬体重',
    '順', '斤量', '上3F', '角通過', '人', '馬'];

  for (let i = startIdx + 1; i < endIdx; i++) {
    const line = lines[i];
    const trimmed = line.trim();
    if (!trimmed) continue;

    let fields = trimmed.split('\t');
    if (fields.length < 4) {
      fields = trimmed.split(/[ ]{2,}/);
    }
    if (fields.length < 4) continue;

    const firstField = fields[0].trim();

    if (skipKeywords.some(kw => firstField.includes(kw))) continue;

    const isNumber = /^\d+$/.test(firstField);
    const isException = isExceptionKeyword(firstField);

    if (!isNumber && !isException) continue;

    const finishPos = firstField;
    let umaban = '';
    let umamei = '';
    let cornerOrder = '';
    let popularity = '';
    let exceptionType = '';

    if (isException) {
      exceptionType = normalizeExceptionType(firstField);
    }

    if (fields.length >= 4) {
      umaban = fields[2] ? fields[2].trim() : '';
      umamei = fields[3] ? fields[3].trim() : '';
    }

    if (!isException) {
      for (let j = fields.length - 1; j >= 4; j--) {
        const val = fields[j] ? fields[j].trim() : '';
        if (val && val.match(/^\d+(-\d+)+$/) && !cornerOrder) {
          cornerOrder = val;
          if (j + 1 < fields.length && fields[j + 1]) {
            popularity = fields[j + 1].trim();
          }
        }
      }
      if (fields.length >= 14 && !cornerOrder) {
        warnings.push(`馬番${umaban} ${umamei}: コーナー通過順が見つかりません。`);
      }
    } else {
      cornerOrder = '';
      popularity = '';
    }

    if (!umaban) {
      warnings.push(`着順${finishPos}: 馬番が取得できませんでした。`);
    }
    if (!umamei) {
      warnings.push(`馬番${umaban}: 馬名が取得できませんでした。`);
    }

    results.push({
      finishPos,
      umaban,
      umamei,
      cornerOrder,
      popularity,
      isException,
      exceptionType,
      fieldCount: fields.length,
      isDeadHeat: false
    });
  }

  const posGroups = {};
  results.forEach((r, idx) => {
    if (/^\d+$/.test(r.finishPos)) {
      if (!posGroups[r.finishPos]) posGroups[r.finishPos] = [];
      posGroups[r.finishPos].push(idx);
    }
  });
  Object.values(posGroups).forEach(indices => {
    if (indices.length > 1) {
      indices.forEach(idx => {
        results[idx].isDeadHeat = true;
      });
      warnings.push(`着順${results[indices[0]].finishPos}に同着があります（${indices.map(i => results[i].umamei).join('、')}）。`);
    }
  });

  if (results.length === 0) {
    warnings.push('有効なデータ行が見つかりませんでした。テキスト形式を確認してください。');
  }

  return { results, warnings, raceInfo };
}

function isExceptionKeyword(str) {
  const keywords = ['取消', '除外', '競走中止', '中止', '失格', '発走取消'];
  return keywords.some(kw => str.includes(kw));
}

function normalizeExceptionType(str) {
  if (str.includes('取消') || str.includes('発走取消')) return 'cancel';
  if (str.includes('除外')) return 'exclude';
  if (str.includes('中止')) return 'dnf';
  if (str.includes('失格')) return 'disqualify';
  return 'unknown';
}

// ============================================
// 結果表示（レースタブ）
// ============================================
function renderResultsForRace(panel, data) {
  const { results, warnings, raceInfo } = data;

  const warningsCard = panel.querySelector('.warningsCard');
  const warningsList = panel.querySelector('.warningsList');
  if (warnings.length > 0) {
    warningsList.innerHTML = warnings.map(w => `<li>${escapeHtml(w)}</li>`).join('');
    warningsCard.classList.remove('hidden');
  } else {
    warningsCard.classList.add('hidden');
  }

  const raceInfoCard = panel.querySelector('.raceInfoCard');
  const raceInfoGrid = panel.querySelector('.race-info-grid');
  if (Object.keys(raceInfo).length > 0) {
    const items = [];
    if (raceInfo.date) items.push(['日付', raceInfo.date]);
    if (raceInfo.venue) items.push(['開催場', raceInfo.venue]);
    if (raceInfo.raceNumber) items.push(['レース番号', `第${raceInfo.raceNumber}競走`]);
    if (raceInfo.raceName) items.push(['レース名', raceInfo.raceName]);
    if (raceInfo.trackType) items.push(['コース', raceInfo.trackType]);
    if (raceInfo.distance) items.push(['距離', raceInfo.distance]);
    if (raceInfo.weather) items.push(['天候', raceInfo.weather]);
    if (raceInfo.trackCondition) items.push(['馬場状態', raceInfo.trackCondition]);
    raceInfoGrid.innerHTML = items.map(([label, value]) =>
      `<div class="race-info-item"><span class="label">${label}: </span><span class="value">${escapeHtml(value)}</span></div>`
    ).join('');
    raceInfoCard.classList.remove('hidden');
  } else {
    raceInfoCard.classList.add('hidden');
  }

  const emptyState = panel.querySelector('.emptyState');
  const resultsCard = panel.querySelector('.resultsCard');
  const exportButtons = panel.querySelector('.exportButtons');
  const tbody = panel.querySelector('.resultsBody');

  if (results.length === 0) {
    emptyState.classList.remove('hidden');
    resultsCard.classList.add('hidden');
    exportButtons.classList.add('hidden');
    return;
  }

  emptyState.classList.add('hidden');
  resultsCard.classList.remove('hidden');
  exportButtons.classList.remove('hidden');

  tbody.innerHTML = results.map(r => renderRow(r)).join('');
}

function renderRow(r) {
  let rowClass = '';
  let badge = '';
  let finishDisplay = escapeHtml(r.finishPos);

  if (r.isException) {
    switch (r.exceptionType) {
      case 'cancel':
        rowClass = 'row-cancel';
        badge = '<span class="badge badge-cancel">取消</span>';
        break;
      case 'exclude':
        rowClass = 'row-exclude';
        badge = '<span class="badge badge-exclude">除外</span>';
        break;
      case 'dnf':
        rowClass = 'row-dnf';
        badge = '<span class="badge badge-dnf">競走中止</span>';
        break;
      case 'disqualify':
        rowClass = 'row-disqualify';
        badge = '<span class="badge badge-disqualify">失格</span>';
        break;
    }
  }

  if (r.isDeadHeat) {
    badge += '<span class="badge badge-deadheat">同着</span>';
  }

  let cornerDisplay = r.cornerOrder
    ? escapeHtml(r.cornerOrder)
    : '<span style="color:var(--text-muted)">—</span>';

  let popularityDisplay = r.popularity || '<span style="color:var(--text-muted)">—</span>';

  return `<tr class="${rowClass}">
    <td><strong>${finishDisplay}</strong>${badge}</td>
    <td>${escapeHtml(r.umaban) || '—'}</td>
    <td>${escapeHtml(r.umamei) || '—'}</td>
    <td>${cornerDisplay}</td>
    <td>${popularityDisplay}</td>
  </tr>`;
}

// ============================================
// 一覧タブ
// ============================================
function renderSummary() {
  const emptyState = document.getElementById('summaryEmptyState');
  const resultsCard = document.getElementById('summaryResultsCard');
  const exportButtons = document.getElementById('summaryExportButtons');
  const tbody = document.getElementById('summaryBody');

  const rowsHtml = [];
  RACE_NUMBERS.forEach(n => {
    const data = raceData[n];
    if (!data || !data.results || data.results.length === 0) return;
    const trackCondition = data.raceInfo.trackCondition || '';
    sortByUmaban(data.results).forEach(r => {
      rowsHtml.push(renderSummaryRow(r, n, trackCondition));
    });
  });

  if (rowsHtml.length === 0) {
    emptyState.classList.remove('hidden');
    resultsCard.classList.add('hidden');
    exportButtons.classList.add('hidden');
    return;
  }

  emptyState.classList.add('hidden');
  resultsCard.classList.remove('hidden');
  exportButtons.classList.remove('hidden');
  tbody.innerHTML = rowsHtml.join('');
}

// 馬番（数値）の昇順に並び替える。取消等で馬番が取得できない行は末尾に回す。
function sortByUmaban(results) {
  return results.slice().sort((a, b) => {
    const na = parseInt(a.umaban, 10);
    const nb = parseInt(b.umaban, 10);
    const va = isNaN(na) ? Infinity : na;
    const vb = isNaN(nb) ? Infinity : nb;
    return va - vb;
  });
}

function renderSummaryRow(r, n, trackCondition) {
  let rowClass = '';
  let badge = '';
  let finishDisplay = escapeHtml(r.finishPos);

  if (r.isException) {
    switch (r.exceptionType) {
      case 'cancel':
        rowClass = 'row-cancel';
        badge = '<span class="badge badge-cancel">取消</span>';
        break;
      case 'exclude':
        rowClass = 'row-exclude';
        badge = '<span class="badge badge-exclude">除外</span>';
        break;
      case 'dnf':
        rowClass = 'row-dnf';
        badge = '<span class="badge badge-dnf">競走中止</span>';
        break;
      case 'disqualify':
        rowClass = 'row-disqualify';
        badge = '<span class="badge badge-disqualify">失格</span>';
        break;
    }
  }
  if (r.isDeadHeat) {
    badge += '<span class="badge badge-deadheat">同着</span>';
  }

  let cornerDisplay = r.cornerOrder
    ? escapeHtml(r.cornerOrder)
    : '<span style="color:var(--text-muted)">—</span>';
  let popularityDisplay = r.popularity || '<span style="color:var(--text-muted)">—</span>';
  let trackDisplay = trackCondition ? escapeHtml(trackCondition) : '<span style="color:var(--text-muted)">—</span>';

  return `<tr class="${rowClass}">
    <td><span class="badge badge-race">R${n}</span></td>
    <td><strong>${finishDisplay}</strong>${badge}</td>
    <td>${escapeHtml(r.umaban) || '—'}</td>
    <td>${escapeHtml(r.umamei) || '—'}</td>
    <td>${cornerDisplay}</td>
    <td>${popularityDisplay}</td>
    <td>${trackDisplay}</td>
  </tr>`;
}

// ============================================
// CSV出力（レースタブ）
// ============================================
function exportCSVRace(n) {
  const data = raceData[n];
  if (!data || data.results.length === 0) return;

  const header = ['着順', '馬番', '馬名', 'コーナー通過順', '人気'];
  const rows = data.results.map(r => [
    r.finishPos + (r.isDeadHeat ? '(同着)' : ''),
    r.umaban,
    r.umamei,
    r.cornerOrder,
    r.popularity
  ]);

  downloadCsv(header, rows, `race_R${n}_results.csv`);
}

// ============================================
// CSV出力（一覧タブ）
// ============================================
function exportSummaryCSV() {
  const header = ['R', '着順', '馬番', '馬名', 'コーナー通過順', '人気', '馬場状態'];
  const rows = [];
  RACE_NUMBERS.forEach(n => {
    const data = raceData[n];
    if (!data || !data.results || data.results.length === 0) return;
    const trackCondition = data.raceInfo.trackCondition || '';
    sortByUmaban(data.results).forEach(r => {
      rows.push([
        n,
        r.finishPos + (r.isDeadHeat ? '(同着)' : ''),
        r.umaban,
        r.umamei,
        r.cornerOrder,
        r.popularity,
        trackCondition
      ]);
    });
  });

  if (rows.length === 0) {
    alert('出力できるデータがありません。各Rのタブでテキストを解析してください。');
    return;
  }

  downloadCsv(header, rows, 'race_results_summary.csv');
}

function downloadCsv(header, rows, filename) {
  const csv = [header, ...rows]
    .map(row => row.map(cell => {
      const s = String(cell || '');
      return `"${s.replace(/"/g, '""')}"`;
    }).join(','))
    .join('\r\n');

  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ============================================
// クリップボードコピー（レースタブ）
// ============================================
function copyToClipboardRace(n, event) {
  const data = raceData[n];
  if (!data || data.results.length === 0) return;

  const header = '着順\t馬番\t馬名\tコーナー通過順\t人気';
  const rows = data.results.map(r =>
    `${r.finishPos}${r.isDeadHeat ? '(同着)' : ''}\t${r.umaban}\t${r.umamei}\t${r.cornerOrder}\t${r.popularity}`
  );
  const text = [header, ...rows].join('\n');

  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const original = btn.textContent;
    btn.textContent = 'コピーしました';
    setTimeout(() => { btn.textContent = original; }, 2000);
  }).catch(() => {
    alert('コピーに失敗しました。');
  });
}

// ============================================
// ユーティリティ
// ============================================
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

init();
