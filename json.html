  <style>
    * {
      margin: 0;

    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #333;
    }
    
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }
    
    .section {
      margin-bottom: 25px;
    }
    
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
    }
    
    textarea, input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: "Monaco", "Menlo", "Ubuntu Mono", monospace;
      font-size: 13px;
      resize: vertical;
    }
    
    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
    }
    
    #textInput {
      height: 200px;
    }
    
    #jsonOutput {
      height: 300px;
      background-color: #f9f9f9;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    button {
      padding: 10px 20px;

      border-radius: 4px;
      background-color: white;

      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    button:hover {
      background-color: #f5f5f5;
      border-color: #999;
    }
    
    button.primary {
      background-color: #4CAF50;
      color: white;
      border-color: #4CAF50;
    }
    
    button.primary:hover {
      background-color: #45a049;
      border-color: #45a049;
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .error {

      margin-bottom: 15px;
      background-color: #ffebee;
      color: #c62828;

      padding: 12px;
      margin-bottom: 15px;

      display: none;

<body>
  <div class="container">
    <h1>kichiuma JSON Extractor</h1>
    <p class="subtitle">競馬データを JSON 形式に変換します</p>
    
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    
    <div class="section">
      <label for="textInput">レースデータを貼り付け</label>
      <textarea id="textInput" placeholder="競馬場名、レース番号、馬のデータをここに貼り付けてください"></textarea>
    </div>
    
    <div class="button-group">
      <button class="primary" onclick="extractJSON()">テキストから抽出</button>
      <button onclick="clearAll()">クリア</button>
    </div>
    
    <div class="section">
      <div class="output-label">
        <label for="jsonOutput">JSON 出力</label>
        <button class="copy-btn" onclick="copyJSON()" id="copyBtn" style="display: none;">コピー</button>
      </div>
      <textarea id="jsonOutput" readonly></textarea>
    </div>
    
    <div class="instructions">
      <strong>使い方：</strong>
      <ol>
        <li>kichiuma.net のページをブラウザで表示</li>
        <li>以下をコピー：
          <ul style="margin-top: 5px; margin-bottom: 5px; margin-left: 20px;">
            <li>競馬場名（東京、京都など）</li>
            <li>レース番号</li>
            <li>レース名やグレード情報を含む行</li>
            <li>馬場や距離を含む行</li>
            <li>馬のテーブル全体</li>
          </ul>
        </li>
        <li>上のテキストエリアに貼り付け</li>
        <li>「テキストから抽出」をクリック</li>
        <li>JSON をコピーして使用</li>
      </ol>
    </div>
  </div>
  
  <script>
    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('success').classList.remove('show');
    }
    
    function showSuccess(msg) {
      const el = document.getElementById('success');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('error').classList.remove('show');
    }
    
    function clearMessages() {
      document.getElementById('error').classList.remove('show');
      document.getElementById('success').classList.remove('show');
    }
    
    function extractJSON() {
      clearMessages();
      const textInput = document.getElementById('textInput').value;
      
      if (!textInput.trim()) {
        showError('テキストを入力してください');
        return;
      }
      
      try {
        // 行全体をtrimすると、末尾の数値列が空欄（タブ+空白のみ）の行で
        // その空欄列が消えてしまい、列数がずれてデータが欠落するため、
        // ここでは空行の除去のみ行い、各行の内容はtrimしない
        const lines = textInput.split(/\r?\n/).filter(line => line.trim() !== '');
        
        // Extract race info from first lines
        let venue = '不明';
        let raceNum = '';
        let surface = '芝';
        let distance = 0;
        let raceName = '';
        let grade = '通常';
        
        // Venue is typically first line
        if (lines[0]) {
          venue = lines[0].trim();
        }
        
        // Race number is typically second line
        if (lines[1]) {
          raceNum = lines[1].trim();
        }
        
        // Search for race details in early lines
        for (let i = 0; i < Math.min(lines.length, 15); i++) {
          const line = lines[i];
          
          // Extract surface and distance
          const surfaceMatch = line.match(/([芝ダ])(\d{4})/);
          if (surfaceMatch) {
            surface = surfaceMatch[1];
            distance = parseInt(surfaceMatch[2]);
          }
          
          // Extract grade
          if (line.includes('GI') || line.includes('G1')) {
            grade = 'GI';
          } else if (line.includes('GII') || line.includes('G2')) {
            grade = 'GII';
          } else if (line.includes('GIII') || line.includes('G3')) {
            grade = 'GIII';
          } else if (line.includes('リステッド') || line.match(/L\s|L$/)) {
            grade = 'L';
          } else if (line.includes('OP')) {
            grade = 'OP';
          }
          
          // Extract race name
          if (line.includes('ステークス') || line.includes('特別') || line.includes('杯') || 
              line.includes('記念') || line.includes('ダービー') || line.includes('オークス')) {
            raceName = line.replace(/\s*\(.*\)/, '').trim();
          }
        }
        
        // Find table header line
        // 単純に「馬」「競」「名」の3文字を含むかで判定すると、
        // 「名古屋競馬」のような開催場名の行でも誤って一致してしまうため、
        // ヘッダー行に特有の文言（競走馬名／先行力・末脚力）で判定する
        let tableStartIdx = -1;
        for (let i = 0; i < lines.length; i++) {
          const compact = lines[i].replace(/[\s　]/g, '');
          if (compact.includes('競走馬名') || (lines[i].includes('先行力') && lines[i].includes('末脚力'))) {
            tableStartIdx = i + 1;
            break;
          }
        }
        
        if (tableStartIdx === -1) {
          showError('馬のテーブルが見つかりません');
          return;
        }
        
        // Parse horse data
        const horses = [];
        for (let i = tableStartIdx; i < lines.length; i++) {
          const line = lines[i];
          if (!line || line.includes('※')) break;
          
          const horse = parseTextLine(line);
          if (horse.name) {
            horses.push(horse);
          }
        }
        
        if (horses.length === 0) {
          showError('馬のデータが見つかりません');
          return;
        }
        
        const result = {
          race_info: {
            venue,
            surface,
            distance,
            race_name: raceName,
            grade
          },
          horses
        };
        
        const jsonStr = JSON.stringify(result, null, 2);
        document.getElementById('jsonOutput').value = jsonStr;
        document.getElementById('copyBtn').style.display = 'inline-block';
        showSuccess(`${horses.length} 頭のデータを抽出しました`);
        
      } catch (err) {
        showError('エラー: ' + err.message);
      }
    }
    
    function parseTextLine(line) {
      // Split by tab character first
      let parts = line.split('\t').map(p => p.trim());
      
      // If no tabs, try splitting by whitespace
      if (parts.length < 5) {
        parts = line.split(/\s+/).filter(p => p !== '');
      }
      
      if (parts.length < 4) return { name: '' };
      
      // 末尾の数値列が空欄（"…"や半角スペースのみ）だと、その列ごと
      // 行末から消えて列数がずれることがあるため、13列になるまで
      // 空文字で埋めておく。埋めた列は下で0扱いになる。
      while (parts.length < 13) parts.push('');
      
      const num = parseInt(parts[0], 10) || 0;
      if (num === 0 || num > 20) return { name: '' };
      
      // Tab-separated format:
      // 0: num (馬番)
      // 1: eval symbol
      // 2: sp (SP能力値)
      // 3: name (競走馬名)
      // 4: senkou (先行力)
      // 5: sp_trust symbol
      // 6: sp_adjust (SP調整)
      // 7: sp_adjust symbol
      // 8: (中間値)
      // 9: symbol
      // 10: sp_max (SP最大)
      // 11: symbol
      // 12: suikyaku (末脚力)
      
      const name = (parts[3] || '').trim();
      // 馬名列に日本語文字が含まれない場合はデータ行とみなさない
      // （"8-10"のような非データ行の誤検出を防ぐ）
      if (!name || !/[ぁ-んァ-ヶー一-龠]/.test(name)) return { name: '' };
      
      // 数値が取得できない項目（馬名はあるが数値が空欄）は0で埋める
      const sp = parseFloat(parts[2]) || 0;
      const senkou = parseInt(parts[4], 10) || 0;
      const sp_max = parseInt(parts[10], 10) || 0;
      const suikyaku = parseInt(parts[12], 10) || 0;
      
      return {
        num,
        name,
        sp,
        senkou,
        sp_max,
        suikyaku,
        agari_rank: null
      };
    }
    
    function parseHorseRow(cells) {
      const getText = (cell) => cell?.innerText?.trim() || '';
      const getNum = (cell) => parseInt(getText(cell)) || 0;
      const getFloat = (cell) => parseFloat(getText(cell)) || 0;
      
      const num = getNum(cells[0]);
      const name = getText(cells[2]);
      const sp = getFloat(cells[3]);
      const senkou = getNum(cells[4]);
      
      // sp_max: 右に2個シフト
      const sp_max = getNum(cells[7]) || getNum(cells[8]) || getNum(cells[9]);
      const suikyaku = getNum(cells[10]) || getNum(cells[11]);
      
      return {
        num,
        name,
        sp,
        senkou,
        sp_max,
        suikyaku,
        agari_rank: null
      };
    }
    
    function copyJSON() {
      const textarea = document.getElementById('jsonOutput');
      textarea.select();
      document.execCommand('copy');
      showSuccess('JSON をコピーしました');
    }
    
    function clearAll() {
      document.getElementById('textInput').value = '';
      document.getElementById('jsonOutput').value = '';
      document.getElementById('copyBtn').style.display = 'none';
      clearMessages();
    }
  </script>
</body>
</html>
